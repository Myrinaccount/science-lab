<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng thí nghiệm hoá học ảo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* Bố cục: mặt bàn thí nghiệm tối ở giữa, dải đồng hồ kiểu máy đo phía trên,
     kệ hoá chất dán nhãn có vạch màu theo loại chất ở dưới (bên trái trên màn hình rộng). */
  --paper:#eef1ef; --card:#fbfcfb; --ink:#14201f; --muted:#566764; --line:#cfd8d4;
  --bench:#1b292b; --bench-2:#25383a;
  --accent:#0d69bd; --accent-ink:#ffffff; --accent-soft:#dbe9f6;
  --warn:#a85f00; --warn-soft:#fbeed6; --bad:#b3362a; --good:#1c7f4b;
  --lcd:#101a1b; --lcd-ink:#c9f2e3;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --k-acid:#c5432d; --k-base:#2a6bcb; --k-salt:#78878a; --k-metal:#8690a0; --k-nonmetal:#ad8a18;
  --k-oxide:#8a583a; --k-gas:#4f9fb1; --k-organic:#3b9556; --k-ind:#8a4dbd; --k-other:#536c77; --k-solvent:#3f93d2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1515; --card:#162020; --ink:#e4eeec; --muted:#8fa19d; --line:#2a3a39;
    --bench:#0a1112; --bench-2:#132021;
    --accent:#58aaf2; --accent-ink:#04121d; --accent-soft:#13304a;
    --warn:#e5a543; --warn-soft:#3a2c10; --bad:#f07366; --good:#52c98c;
    --lcd:#060c0c; --lcd-ink:#bff0de;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1515; --card:#162020; --ink:#e4eeec; --muted:#8fa19d; --line:#2a3a39;
  --bench:#0a1112; --bench-2:#132021;
  --accent:#58aaf2; --accent-ink:#04121d; --accent-soft:#13304a;
  --warn:#e5a543; --warn-soft:#3a2c10; --bad:#f07366; --good:#52c98c;
  --lcd:#060c0c; --lcd-ink:#bff0de;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-body);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- dải đồng hồ ---------- */
#top{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.brand h1{font:700 23px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.brand p{margin-top:3px;font-size:12px;color:var(--muted)}
#timebar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-left:auto}
.tgroup{display:flex;gap:6px}
.tbtn{min-height:42px;min-width:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  font:600 16px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tbtn.play{background:var(--accent);color:var(--accent-ink);border-color:transparent;min-width:66px}
.tbtn.play.paused{background:var(--warn);color:#fff}
.tbtn.guide{border-color:var(--accent);color:var(--accent)}
.speeds{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speeds button{min-width:40px;min-height:40px;padding:0 4px;border:0;border-left:1px solid var(--line);background:var(--card);
  font:600 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.speeds button:first-child{border-left:0}
.speeds button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.readout{display:flex;align-items:center;gap:8px;background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:3px 6px 3px 10px;min-height:42px}
.ro{display:flex;flex-direction:column;gap:1px}
.ro span{font:500 9.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;opacity:.72}
.ro output{font:600 23px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.05em;min-width:6.4ch}
.readout .tbtn{min-height:34px;min-width:0;background:transparent;color:var(--lcd-ink);border-color:rgba(201,242,227,.35);font-size:14px;padding:0 10px}
.readout .tbtn.on{background:var(--lcd-ink);color:var(--lcd)}
.only-sm{display:none}

/* ---------- bàn thí nghiệm ---------- */
#main{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column}
#toasts{flex:none;display:flex;flex-direction:column}
.toast{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);border-left:5px solid var(--accent);padding:7px 12px;font-size:13px;line-height:1.4}
.toast.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.toast b{font-weight:600}
#bench{flex:none;position:relative;
  background-color:var(--bench);
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(var(--bench),var(--bench-2));
  background-size:24px 24px,24px 24px,100% 100%}
#b2d{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px}
#b3d{display:none;position:relative;height:270px}
#bench.v3 #b3d{display:block}
#bench.v3 #b2d{display:none}
#c3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.lbls{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.l3{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid rgba(255,255,255,.3);background:rgba(10,18,20,.74);color:#e6f0ee;border-radius:6px;
  padding:3px 7px;display:flex;flex-direction:column;align-items:center;line-height:1.15;white-space:nowrap}
.l3 b{font:600 14px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.l3 span{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums;display:none}
.l3.sel{border-color:#5fb4ff;background:rgba(13,60,105,.88)}
.l3.sel span{display:block}
.bbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:flex-end;pointer-events:none}
.bbar button,#bAdd{pointer-events:auto;min-height:36px;padding:0 9px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(10,18,20,.74);color:#e6f0ee;
  font:600 13px var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
#bAdd{position:absolute;right:8px;bottom:8px}
#bench:not(.v3) .bbar{position:static;padding:8px 12px 0}
#bench:not(.v3) .only3{display:none}
.b3hint{position:absolute;left:10px;right:118px;bottom:6px;font-size:10.5px;color:rgba(230,240,238,.6);pointer-events:none}
.vessel{flex:none;width:126px;padding:4px 4px 8px;border:1px solid transparent;border-radius:10px;background:transparent;color:#e6f0ee;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.vessel canvas{width:116px;height:150px;display:block}
.vessel.sel{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.07)}
.vessel .vn{font:600 15px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.vessel .vm{font-size:11.5px;opacity:.78;font-variant-numeric:tabular-nums}
.vessel.add{align-self:center;width:92px;min-height:112px;justify-content:center;border:1px dashed rgba(255,255,255,.34);gap:6px}
.vessel.add .plus{font:500 34px/1 var(--f-display)}
.vessel.add .vn{font-size:14px;text-align:center;white-space:normal}

/* ---------- bảng thông số ---------- */
#panel{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.empty{color:var(--muted)}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle h2{font:700 25px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.hot{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.stat span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stat b{font:600 21px/1.15 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.now{border-left:3px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.obs{font-size:13.5px;color:var(--muted);max-width:68ch}
#pAgain{display:flex;flex-wrap:wrap;gap:8px}
.ptab{display:grid;grid-template-columns:repeat(18,34px);grid-auto-rows:38px;gap:2px;width:max-content}
.pc{border:1px solid transparent;border-radius:3px;padding:0;color:#16211f;font:700 15px/1 var(--f-display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pc i{font:400 8.5px/1 var(--f-body);font-style:normal;opacity:.75}
.pc.has{border:2px solid var(--ink)}
.ptinfo{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick .btn{text-align:center;padding:6px 4px;font-size:13px;font-weight:600;border-color:var(--accent);color:var(--accent)}
.lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.eq{font:500 18px/1.35 var(--f-display);letter-spacing:.015em;overflow-wrap:anywhere}
.arw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:.9;margin:0 3px}
.arw i{font:500 11px/1 var(--f-body);font-style:normal;color:var(--muted);white-space:nowrap}
.seg{display:flex;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:none;min-height:40px;padding:6px 5px;font:600 14px var(--f-display);text-transform:uppercase;letter-spacing:.02em;
  color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tablewrap{overflow-x:auto}
table.comp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
.comp th,.comp td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.comp thead th{font-size:11.5px;font-weight:500;color:var(--muted)}
.comp th[scope="row"],.comp thead th:first-child{text-align:left;font-weight:400}
.comp th[scope="row"]{white-space:normal;min-width:104px}
.comp .f{font:600 17px/1.1 var(--f-display)}
.comp small{display:block;font-size:11px;color:var(--muted)}
.gasrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gchip{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;background:var(--card);font-variant-numeric:tabular-nums}
.gchip b{font:600 16px var(--f-display)}
dl.params{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;margin:0;font-size:14px}
.params dt,.params dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
.params dt{color:var(--muted)}
.params dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
#chart{display:block;width:100%;height:210px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.log li{border-left:3px solid var(--line);padding-left:10px}
.log time{font:600 13px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.log p{margin-top:2px;font-size:13.5px;color:var(--muted);max-width:68ch}
.log p.w{color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);max-width:70ch}

/* ---------- thanh công cụ ---------- */
#tools{flex:none;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
body.drawer #tools{height:52%}
#tbody{flex:1 1 auto;min-height:0;overflow:auto;display:none}
body.drawer #tbody{display:block}
#ttabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}
#ttabs button{border:0;background:none;min-height:46px;padding:4px 0;font:600 14px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;
  color:var(--muted);border-top:3px solid transparent}
#ttabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent);background:var(--paper)}
.tpad{padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px}
.tsearch input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips.sub .chip{min-height:32px;font-size:12.5px;border-radius:6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.rg{position:relative;text-align:left;border:1px solid var(--line);border-radius:5px;background:var(--card);padding:8px 8px 8px 15px;min-height:58px;
  display:flex;flex-direction:column;gap:3px;overflow:hidden}
.rg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--k,var(--k-other))}
.rg b{font:700 19px/1.05 var(--f-display);letter-spacing:.01em;overflow-wrap:break-word;hyphens:manual}
.rg b.sm{font-size:15.5px;line-height:1.15}
.rg span{font-size:11px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.rg em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.k-acid{--k:var(--k-acid)} .k-base{--k:var(--k-base)} .k-salt{--k:var(--k-salt)} .k-metal{--k:var(--k-metal)} .k-nonmetal{--k:var(--k-nonmetal)}
.k-oxide{--k:var(--k-oxide)} .k-gas{--k:var(--k-gas)} .k-organic{--k:var(--k-organic)} .k-ind{--k:var(--k-ind)} .k-other{--k:var(--k-other)} .k-solvent{--k:var(--k-solvent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--k);margin-right:4px;vertical-align:-1px}
.tsec{display:flex;flex-direction:column;gap:6px}
.tsec h3{font:600 15px var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btn{min-height:44px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:500;text-align:left;line-height:1.25}
.btn small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600;text-align:center}
.btn.danger{color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.calc{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.calc h4{font:600 17px/1.2 var(--f-display);letter-spacing:.02em}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.cgrid label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.cgrid input{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 10px;width:100%;
  font:600 18px var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.cgrid input.auto{border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted)}
.hint.err{color:var(--bad)}
.soltab{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.soltab th,.soltab td{border:1px solid var(--line);padding:4px 6px;text-align:center;min-width:36px;white-space:nowrap}
.soltab th{font:600 14px var(--f-display);background:var(--paper)}
.soltab .sK{background:var(--ink);color:var(--card)}
.soltab .sI{background:var(--warn-soft);color:var(--warn)}
.soltab .sN,.soltab .sU{color:var(--muted)}
.soltab .sT{color:var(--good)}
.series{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font:500 16px var(--f-display)}
.series span{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.series small{font:400 10.5px var(--f-body);color:var(--muted);display:block}

/* ---------- hộp thoại ---------- */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,12,13,.55)}
#sheet[hidden]{display:none}
.card{width:min(520px,100%);max-height:92%;overflow:auto;background:var(--card);border-radius:14px 14px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;
  border-top:7px solid var(--k,var(--accent))}
.sh-h{display:flex;align-items:flex-start;gap:12px}
.sh-h .f{font:700 32px/1 var(--f-display)}
.sh-h .n{font-size:13px;color:var(--muted);margin-top:4px}
.sh-h .btn{margin-left:auto;min-height:38px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 12px;width:100%;
  font:600 21px var(--f-display);font-variant-numeric:tabular-nums}
.fld select{font-size:18px}
.calcline{font:600 18px var(--f-display);color:var(--accent);min-height:1.3em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card.guide{width:min(780px,100%);max-height:94%}
.gidx{display:flex;flex-wrap:wrap;gap:6px}
.gidx .chip{min-height:34px;font-size:12.5px;padding:0 10px}
.guide details{border-top:1px solid var(--line)}
.guide summary{cursor:pointer;font:600 19px/1.25 var(--f-display);letter-spacing:.02em;padding:11px 0}
.guide summary span{color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
.gsec{font-size:14px;line-height:1.55;max-width:68ch;padding:0 0 12px}
.gsec ul,.gsec ol{margin:4px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.gsec p{margin:10px 0 2px}

@media (max-width:719px){
  .brand{display:none}
  #top{padding:8px 12px}
  #timebar{margin-left:0;width:100%}
  .tgroup{flex:1 1 100%}
  .tbtn.guide{white-space:normal;width:70px;min-width:0;padding:0 5px;font-size:13px;line-height:1.05}
  .tbtn.play{min-width:54px;padding:0 8px}
  .speeds button{font-size:16px;padding:0 2px}
  .comp{font-size:13px}
  .comp th,.comp td{padding:6px 4px}
  .speeds{flex:1 1 auto}
  .speeds button{flex:1 1 0;min-width:30px}
  .readout{flex:0 0 auto;padding:3px 5px 3px 8px;gap:5px}
  .readout .tbtn[data-act="treset"]{font-size:17px;padding:0 7px}
  .readout.sw{flex:1 1 auto}
  .readout.sw .ro{margin-right:auto}
  .ro output{font-size:19px;letter-spacing:.02em;min-width:0}
  .readout .tbtn{padding:0 8px;font-size:13px;letter-spacing:.02em}
  .only-lg{display:none}
  .only-sm{display:inline;font-size:17px}
}
@media (min-width:720px){
  #sheet{align-items:center}

/* ============================================================
   DỮ LIỆU HOÁ HỌC — nguyên tử khối, ion, bảng tính tan, kho chất
   Nguyên tử khối làm tròn theo sách giáo khoa (Cl = 35,5; Cu = 64…)
   ============================================================ */
const VM_DKC = 24.79; // L/mol ở điều kiện chuẩn (25 °C, 1 bar)
const AW = {H:1,He:4,Li:7,Be:9,B:11,C:12,N:14,O:16,F:19,Ne:20,Na:23,Mg:24,Al:27,Si:28,P:31,S:32,Cl:35.5,Ar:40,
  K:39,Ca:40,Ti:48,Cr:52,Mn:55,Fe:56,Co:59,Ni:59,Cu:64,Zn:65,Br:80,Sr:88,Ag:108,Sn:119,I:127,Ba:137,Pt:195,Au:197,Hg:201,Pb:207};

function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ const t = a % b; a = b; b = t; } return a; }
function lcm(a, b){ return a / gcd(a, b) * b; }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }

/* ---- Đọc công thức hoá học: hỗ trợ ngoặc ( ) [ ] và muối ngậm nước "CuSO4.5H2O" ---- */
function parseGroup(s, i){
  const c = {};
  while (i < s.length){
    const ch = s[i];
    if (ch === '(' || ch === '['){
      const r = parseGroup(s, i + 1); i = r.i;
      if (s[i] !== ')' && s[i] !== ']') throw new Error('Thiếu dấu đóng ngoặc');
      i++;
      let n = ''; while (i < s.length && /\d/.test(s[i])) n += s[i++];
      const k = n ? +n : 1;
      for (const e in r.c) c[e] = (c[e] || 0) + r.c[e] * k;
    } else if (ch === ')' || ch === ']'){
      break;
    } else if (/[A-Z]/.test(ch)){
      let el = ch; i++;
      while (i < s.length && /[a-z]/.test(s[i])) el += s[i++];
      let n = ''; while (i < s.length && /\d/.test(s[i])) n += s[i++];
      if (!(el in AW)) throw new Error('Không nhận ra nguyên tố "' + el + '"');
      c[el] = (c[el] || 0) + (n ? +n : 1);
    } else throw new Error('Ký tự không hợp lệ "' + ch + '"');
  }
  return {c, i};
}
function parseFormula(str){
  const total = {};
  const parts = String(str).replace(/\s+/g, '').replace(/·/g, '.').split('.');
  for (let part of parts){
    if (!part) throw new Error('Công thức trống');
    let mult = 1; const m = part.match(/^(\d+)(.*)$/);
    if (m){ mult = +m[1]; part = m[2]; }
    const r = parseGroup(part, 0);
    if (r.i !== part.length) throw new Error('Dấu ngoặc không khớp');
    for (const e in r.c) total[e] = (total[e] || 0) + r.c[e] * mult;
  }
  return total;
}
function molarMass(f){ const c = parseFormula(f); let m = 0; for (const e in c) m += AW[e] * c[e]; return m; }
function fHTML(f){ return f.replace(/([A-Za-z\)\]])(\d+)/g, '$1<sub>$2</sub>').replace(/\./g, '·'); }

/* ---- Kho chất ---- */

function sp(id, o){
  o.id = id; if (!o.f) o.f = id;

}

function ionicFormula(c, a){
  const C = CAT[c], A = AN[a], g = gcd(C.z, A.z), nc = A.z / g, na = C.z / g;

  const ap = (A.poly && na > 1 ? '(' + A.f + ')' : A.f) + (na > 1 ? na : '');
  return {f: A.pre ? ap + cp : cp + ap, nc, na};
}

function derive(c){
  const s0 = c.sp, nW = s0.H2O || 0, mW = nW * 18;
  let V = mW, mL = mW, mS = 0;
  for (const id in s0){

    const s = SP[id], n = s0[id];
    if (s.vm && (s.ph === 'liq' || s.ph === 'gas')){ V += n * s.vm; mL += n * s.M; }
    else if (s.ph !== 'gas') mS += n * s.M;
  }
  return {nW, mW, V, VL:V / 1000, mL, mS, wet:mW > 0.05};
}
function heatCap(d){ return 4.18 * d.mW + 2.2 * (d.mL - d.mW) + 0.8 * d.mS + 25; }
function gasCap(s, d, T){
  if (!d.wet) return 0;
  let cap = (s.gsol || 0) * d.VL;
  if (s.gT && T > 25) cap *= Math.max(0, (100 - T) / 75);
  return cap;
}
function dissolved(c, d, id){
  const s = SP[id], n = c.sp[id] || 0;
  if (!n) return 0;
  if (s.ph === 'liq') return n;
  if (s.ph === 'gas') return Math.min(n, gasCap(s, d, c.T));
  if (s.ph === 'sol') return d.wet ? Math.min(n, (s.S || 60) * d.mW / 100 / s.M) : 0;

}

const RULES = [], RIDX = {}, OVERRIDE = new Set(), PCACHE = new Map();
const TOX = {SO2:1, NO2:1, NO:1, Cl2:1, H2S:1};
function pkey(a, b){ return a < b ? a + '|' + b : b + '|' + a; }

function markOf(id, r){
  const s = SP[id];
  if (s.ph === 'gas' && (s.gsol || 0) < 2) return '↑';
  if (r.aqm && s.ph === 'solid') return '↓';
  return '';
}
function eqHTML(r){
  const side = (m, prod) => Object.keys(m).map(id => (m[id] !== 1 ? m[id] : '') + SP[id].h + (prod ? markOf(id, r) : ''));
  const L = side(r.re, false);
  if (r.air) for (const id in r.air) L.push((r.air[id] !== 1 ? r.air[id] : '') + SP[id].h);
  const over = [];
  if (r.over) over.push(r.over);
  if (r.need) for (const id of r.need) over.push(SP[id].h);
  if (r.minT != null || r.burn) over.push('t°');
  return L.join(' + ') + ' <span class="arw">' + (over.length ? '<i>' + over.join(', ') + '</i>' : '') +
    (r.rev ? '⇌' : '→') + '</span> ' + side(r.pr, true).join(' + ');
}
/* Rút gọn hệ số về số nguyên nhỏ nhất, khử chất xuất hiện ở cả hai vế; trả về hệ số quy đổi */
function mkRule(o){
  o.aqm = !!(o.wet || o.re.H2O);
  const net = {};
  for (const k in o.re) addTo(net, k, -o.re[k]);
  for (const k in o.pr) addTo(net, k, o.pr[k]);
  const vals = [];
  for (const k in net) if (Math.abs(net[k]) > 1e-9) vals.push(Math.abs(net[k]));
  if (o.air) for (const k in o.air) vals.push(o.air[k]);
  let m = 1;
  for (; m <= 60; m++) if (vals.every(v => Math.abs(v * m - Math.round(v * m)) < 1e-6)) break;
  let g = 0; for (const v of vals) g = gcd(g, Math.round(v * m));
  const re = {}, pr = {};
  for (const k in o.re) if (net[k] < -1e-9) re[k] = Math.round(-net[k] * m) / g;
  for (const k in net) if (net[k] < -1e-9 && !(k in re)) re[k] = Math.round(-net[k] * m) / g;
  for (const k in o.pr) if (net[k] > 1e-9) pr[k] = Math.round(net[k] * m) / g;
  for (const k in net) if (net[k] > 1e-9 && !(k in pr)) pr[k] = Math.round(net[k] * m) / g;
  o.re = re; o.pr = pr;
  if (o.air){ const na = {}; for (const k in o.air) na[k] = Math.round(o.air[k] * m) / g; o.air = na; }
  const f = m / g;
  if (o.dH) o.dH *= f;
  if (!o.tau) o.tau = 1;
  if (!o.warn) for (const k in pr) if (TOX[k]){ o.warn = 'Khí ' + SP[k].h + ' độc. Ngoài thực tế phải làm thí nghiệm này trong tủ hút.'; break; }
  if (!o.key) o.key = Object.keys(re).map(k => re[k] + k).join('+') + '>' + Object.keys(pr).map(k => pr[k] + k).join('+') + (o.over || '');
  o.eq = eqHTML(o);
  return f;
}
/* Khai báo phản ứng bằng chuỗi: "2Na + 2H2O -> 2NaOH + H2". Chất có dấu * lấy từ không khí. */
function rx(eqs, o){
  o = o || {}; o.re = {}; o.pr = {};
  const parts = eqs.split('->');
  const read = (txt, into) => {
    for (const t of txt.split(' + ')){
      const m = t.trim().match(/^(\d+)?\s*(.+)$/);
      let id = m[2]; const k = m[1] ? +m[1] : 1;
      if (id.endsWith('*')){ id = id.slice(0, -1); (o.air = o.air || {})[id] = k; continue; }
      if (!SP[id]) throw new Error('Thiếu chất ' + id + ' trong: ' + eqs);
      into[id] = k;
    }
  };
  read(parts[0], o.re); read(parts[1], o.pr);
  const first = Object.keys(o.re)[0];
  if (o.override){ const ks = Object.keys(o.re).filter(k => k !== 'H2O'); OVERRIDE.add(pkey(ks[0], ks[1])); }
  mkRule(o);
  RULES.push(o); (RIDX[first] = RIDX[first] || []).push(o);
  return o;
}
function note(a, b, o){
  const r = Object.assign({note:true, re:{[a]:1, [b]:1}, pr:{}, tau:1}, o);
  r.key = 'note:' + a + '+' + b + (o.k || '');
  if (!r.eq) r.eq = SP[a].h + ' + ' + SP[b].h + ' <span class="arw">↛</span> không phản ứng';
  RULES.push(r); (RIDX[a] = RIDX[a] || []).push(r);
}

const STRONG = {HCl:1, HBr:1, HI:1, HNO3:1, H2SO4:1};

function dissolves(acid, solid){
  const y = solid.ion.a, c = solid.ion.c;
  if (acid.id === 'HNO3' && (c === 'Fe2' || y === 'S')) return false;
  if (y === 'OH' || y === 'O' || y === 'CO3') return true;
  if (!STRONG[acid.id]) return false;
  if (y === 'SO3' || y === 'PO4') return true;
  if (y === 'S') return c === 'Fe2' || c === 'Zn';

function exRule(A, B){
  const a = A.ion, b = B.ion;
  if (a.c === b.c || a.a === b.a) return null;
  const basic = x => x === 'O' || x === 'OH';
  if (basic(a.a) && basic(b.a)) return null;
  const aK = A.sol === 'K', bK = B.sol === 'K';
  if (aK && bK) return null;
  const acid = a.c === 'H' ? A : b.c === 'H' ? B : null;
  let solid = null;
  if (aK || bK){
    solid = aK ? A : B;
    if (!acid || acid === solid || !dissolves(acid, solid)) return null;
  }
  const other = acid ? (acid === A ? B : A) : null;
  if (acid && !solid && !STRONG[acid.id] && !WEAKSET[other.ion.a]) return null;
  const p1 = PAIR[a.c + '|' + b.a], p2 = PAIR[b.c + '|' + a.a];
  if (!p1 || !p2 || p1.code === 'N' || p2.code === 'N') return null;
  const nh3 = A.id === 'NH3' || B.id === 'NH3';
  const bothT = (A.sol !== 'I') && (B.sol !== 'I');
  let drv = false; const condI = [];
  for (const p of [p1, p2]){
    if (p.code === 'W' || p.code === 'K' || p.code === 'U') drv = true;
    else if (p.code === 'A' && !STRONG[p.id] && acid) drv = true;
    else if (p.code === 'I' && !nh3 && bothT) condI.push(p);
  }
  if (!drv && !condI.length) return null;
  const eqA = a.nc * zOf(a.c), eqB = b.nc * zOf(b.c);
  const q1 = lcm(zOf(a.c), zOf(b.a)), q2 = lcm(zOf(b.c), zOf(a.a));
  const E = lcm(lcm(eqA, eqB), lcm(q1, q2));
  const r = {re:{}, pr:{}, wet:true};
  r.re[A.id] = E / eqA; r.re[B.id] = E / eqB;
  if (A.id === 'NH3') addTo(r.re, 'H2O', E / eqA);
  if (B.id === 'NH3') addTo(r.re, 'H2O', E / eqB);
  for (const [p, q] of [[p1, q1], [p2, q2]]){
    const n = E / q;
    if (p.code === 'U'){ for (const k in p.map){ const v = p.map[k] * n; if (v > 0) addTo(r.pr, k, v); else addTo(r.re, k, -v); } }
    else addTo(r.pr, p.id, n);
  }
  if (solid){ r.tau = solid.ion.a === 'O' ? (OXTAU[solid.id] || 60) : (SOLIDTAU[solid.ion.a] || 15); r.drive = acid.id; }
  else { r.tau = 0.5; r.q10 = false; }
  if (!drv){
    r.fn = (c, d, L) => {
      for (const p of condI){ const s = SP[p.id]; if (((c.sp[p.id] || 0) + L * (r.pr[p.id] || 0)) * s.M > s.S * d.mW / 100) return true; }
      return false;
    };
  }
  if (acid && other.ion.a === 'HCO3') r.noAq = ['Na2CO3', 'K2CO3'];
  mkRule(r);
  let dH = 0; const w = r.pr.H2O || 0;
  const hasOH = a.a === 'OH' || b.a === 'OH', hasO = a.a === 'O' || b.a === 'O';
  if (acid && hasOH) dH -= 57 * (w || r.re.NH3 || 0);
  else if (acid && hasO) dH -= 45 * w;
  if (r.pr.CO2) dH -= 12 * r.pr.CO2;
  for (const id in r.pr) if (PPTDH[id]) dH += PPTDH[id] * r.pr[id];
  r.dH = dH;
  const parts = [];
  if (solid) parts.push('chất rắn ' + solid.h + ' tan dần');
  for (const id in r.pr){
    const s = SP[id];
    if (id === 'S') parts.push('dung dịch vẩn đục vàng nhạt do lưu huỳnh');
    else if (s.ph === 'solid') parts.push('xuất hiện kết tủa ' + (s.cn || 'trắng') + ' ' + s.h);
    else if (id === 'NH3') parts.push('có mùi khai của NH<sub>3</sub> (đun nhẹ thì khí thoát ra, làm xanh giấy quỳ tím ẩm)');
    else if (s.ph === 'gas' && (s.gsol || 0) < 2) parts.push('sủi bọt khí ' + s.h + (s.gd ? ' (' + s.gd + ')' : ''));
    else if (id === 'I2') parts.push('dung dịch chuyển vàng nâu do I<sub>2</sub> sinh ra');
    else if (s.sol === 'I') parts.push('dung dịch vẩn đục do ' + s.h + ' ít tan');
  }
  if (!parts.length) parts.push(acid && (hasOH || hasO) ? 'phản ứng trung hoà, toả nhiệt; không thấy hiện tượng nếu không dùng chất chỉ thị' : 'không có hiện tượng nhìn thấy rõ');
  const t = parts.join('; ');
  r.obs = t.charAt(0).toUpperCase() + t.slice(1) + '.';
  return r;
}

/* ---------- Kim loại + dung dịch muối / acid (dãy thế điện cực chuẩn) ---------- */
const METALS = {Mg:{cat:'Mg',E:-2.37,tau:10}, Al:{cat:'Al',E:-1.66,tau:45}, Zn:{cat:'Zn',E:-0.76,tau:40},
  Fe:{cat:'Fe2',E:-0.44,tau:110}, Cu:{cat:'Cu',E:0.34,tau:200}, Ag:{cat:'Ag',E:0.80,tau:300}};
const OXC = {H:{E:0,ne:1}, Al:{E:-1.66,ne:3,to:'Al'}, Zn:{E:-0.76,ne:2,to:'Zn'}, Fe2:{E:-0.44,ne:2,to:'Fe'},
  Pb:{E:-0.13,ne:2,to:'Pb'}, Cu:{E:0.34,ne:2,to:'Cu'}, Fe3:{E:0.77,ne:1}, Ag:{E:0.80,ne:1,to:'Ag'}};
function dispRule(mId, S){
  const M = METALS[mId], s = S.ion, ox = OXC[s.c];
  if (!ox || S.sol === 'K' || S.id === 'NH3') return null;
  if (s.c === M.cat || ox.E <= M.E + 1e-9) return null;
  if (s.c === 'H' && s.a === 'NO3') return null;
  const ok = p => p && (p.code === 'T' || p.code === 'I');
  const pM = PAIR[M.cat + '|' + s.a]; if (!ok(pM)) return null;
  let pF = null;
  if (s.c === 'Fe3'){ pF = PAIR['Fe2|' + s.a]; if (!ok(pF)) return null; }
  const v = CAT[M.cat].z, e = lcm(v, ox.ne), nM = e / v, nOx = e / ox.ne;
  const r = {re:{}, pr:{}, wet:true, drive:S.id};
  r.re[mId] = nM; r.re[S.id] = nOx / s.nc;
  addTo(r.pr, pM.id, nM / SP[pM.id].ion.nc);
  if (pF) addTo(r.pr, pF.id, nOx / SP[pF.id].ion.nc);
  else if (s.c === 'H') r.pr.H2 = nOx / 2;
  else r.pr[ox.to] = nOx;
  r.tau = M.tau * (s.c === 'H' ? (STRONG[S.id] ? 1 : 4) : s.c === 'Fe3' ? 0.5 : s.c === 'Ag' ? 0.8 : 1.2);
  if (S.id === 'H2SO4'){ r.conc = [['H2SO4', 0, 11]]; r.over = 'loãng'; }
  const f = mkRule(r);
  r.dH = -96.5 * e * (ox.E - M.E) * f;
  const mh = SP[mId].name.toLowerCase();
  if (s.c === 'H') r.obs = 'Kim loại ' + mh + ' tan dần, sủi bọt khí H<sub>2</sub> không màu.';
  else if (pF) r.obs = 'Kim loại ' + mh + ' tan dần; dung dịch nhạt dần màu vàng nâu của Fe<sup>3+</sup>.';
  else r.obs = 'Kim loại ' + SP[ox.to].name.toLowerCase() + ' (' + SP[ox.to].cn + ') bám lên bề mặt ' + mh + '; màu dung dịch thay đổi dần.';
  return r;
}
function pairRules(a, b){
  const k = pkey(a, b);
  let v = PCACHE.get(k);
  if (v !== undefined) return v;
  v = null;
  if (!OVERRIDE.has(k)){
    const A = SP[a], B = SP[b];
    if (A.ion && B.ion) v = exRule(A, B);
    if (!v && METALS[a] && B.ion) v = dispRule(a, B);
    if (!v && METALS[b] && A.ion) v = dispRule(b, A);
  }
  PCACHE.set(k, v);
  return v;
}

const BURN = RULES.filter(r => r.burn);

/* ============================================================
   BƯỚC MÔ PHỎNG
   ============================================================ */
function logRule(c, r, x, L0){
  if (r.silent) return;
  let a = c.act[r.key];
  if (!a || c.now - a.last > 4){
    a = c.act[r.key] = {last:c.now, x:0, r};
    const e = {t:c.now, r, a};
    c.log.push(e); if (c.log.length > 60) c.log.shift();
    EVQ.push({c, r});
  }
  a.last = c.now; a.x += x; if (L0) a.L0 = L0;
}
function runRule(c, d, r, dt){
  if (r.wet && !d.wet) return 0;
  if (r.dry && d.wet) return 0;
  if (r.minT != null && c.T < r.minT) return 0;
  if (r.maxT != null && c.T > r.maxT) return 0;
  let L = Infinity;
  for (const id in r.re){ const n = c.sp[id]; if (!(n > EPS)) return 0; const q = n / r.re[id]; if (q < L) L = q; }
  if (r.need) for (const id of r.need) if (!(c.sp[id] > EPS)) return 0;
  if (r.noAq) for (const id of r.noAq) if (c.sp[id] > 1e-7) return 0;
  if (r.conc) for (const q of r.conc){ const C = conc(c, d, q[0]); if (C < q[1] || C >= q[2]) return 0; }
  if (r.fn && !r.fn(c, d, L)) return 0;
  if (r.note){ logRule(c, r, 0); return 0; }
  if (r.burn){
    if (!c.burning){ if (r.ign != null && c.T >= r.ign) c.burning = true; else return 0; }
    c._burn = r;
  }
  if (r.cap){ L = Math.min(L, r.cap(c, d)); if (!(L > EPS)) return 0; }
  let k = 1;
  if (r.q10 !== false) k *= clamp(Math.pow(2, (Math.min(c.T, 100) - 25) / 10), 0.25, 64);
  if (r.drive) k *= clamp(conc(c, d, r.drive), 0.2, 6);
  const a0 = c.act[r.key];
  const L0 = a0 && c.now - a0.last <= 4 ? Math.max(a0.L0 || 0, L) : L;
  let x = L * (1 - Math.exp(-dt * k / r.tau));
  if (L - x < Math.max(2e-7, 0.003 * L0)) x = L;
  for (const id in r.re){ const v = c.sp[id] - x * r.re[id]; if (v < 1e-12) delete c.sp[id]; else c.sp[id] = v; }
  for (const id in r.pr) c.sp[id] = (c.sp[id] || 0) + x * r.pr[id];
  logRule(c, r, x, L0);
  return -(r.dH || 0) * x * 1000;
}
function totalGas(c){ let g = 0; for (const id in c.gasOut) g += c.gasOut[id]; return g; }

function stepVessel(c, dt, now){
  c.now = now;
  let d = derive(c);
  if (c.feed.length){
    for (const f of c.feed){ const x = Math.min(f.n, f.rate * dt); f.n -= x; c.sp[f.id] = (c.sp[f.id] || 0) + x; }
    c.feed = c.feed.filter(f => f.n > 1e-10);
  }
  let Q = 0;
  c._burn = null;
  const ids = Object.keys(c.sp);
  for (const id of ids){ const L = RIDX[id]; if (L) for (let i = 0; i < L.length; i++) Q += runRule(c, d, L[i], dt); }
  for (let i = 0; i < ids.length; i++){
    if (ids[i] === 'H2O') continue;
    for (let j = i + 1; j < ids.length; j++){
      if (ids[j] === 'H2O') continue;
      const r = pairRules(ids[i], ids[j]);
      if (r) Q += runRule(c, d, r, dt);
    }
  }
  if (c.burning && !c._burn) c.burning = false;
  d = derive(c);
  // khí thoát ra
  const decay = Math.exp(-dt / 1.0);
  for (const id in c.flow){ c.flow[id] *= decay; if (c.flow[id] < 1e-9) delete c.flow[id]; }
  for (const id in c.sp){
    const s = SP[id]; if (s.ph !== 'gas') continue;
    const ex = c.sp[id] - gasCap(s, d, c.T); if (ex <= 0) continue;
    let out = ex * (1 - Math.exp(-dt / 1.2)); if (ex - out < 1e-8) out = ex;
    const v = c.sp[id] - out; if (v < 1e-12) delete c.sp[id]; else c.sp[id] = v;
    addTo(c.gasOut, id, out);
    c.flow[id] = (c.flow[id] || 0) + (out / dt) * (1 - decay);
  }
  // nhiệt hoà tan của chất rắn vừa cho vào
  for (const id in c.und){
    const n = c.sp[id] || 0, u = n - dissolved(c, d, id), du = c.und[id] - u;
    if (du !== 0) Q += -SP[id].dHsol * du * 1000;
    if (n <= 0) delete c.und[id]; else c.und[id] = u;
  }
  // nhiệt pha loãng H2SO4
  const nS = c.sp.H2SO4 || 0;
  if (nS > 0){ const qn = qMix(nS, c.sp.H2O || 0); if (qn > c.qS) Q += (qn - c.qS) * 1000; c.qS = qn; } else c.qS = 0;
  // nguồn nhiệt, sự cháy, nguội dần
  const Cp = heatCap(d);
  if (c.heat){
    const H = HEAT[c.heat];
    if (d.V > 0.3) Q += H.P * Math.max(0, 1 - (c.T - 25) / (H.T - 25)) * dt;
    else c.T += (H.T - c.T) * (1 - Math.exp(-dt / 12));
  }
  if (c.burning && c._burn){ const ft = c._burn.flameT || 700; if (c.T < ft) c.T += (ft - c.T) * (1 - Math.exp(-dt / 3)); }
  c.T += Q / Cp;
  if (!c.heat && !c.burning){ const tc = d.V > 1 ? 300 + 4 * d.V : 45; c.T += (25 - c.T) * (1 - Math.exp(-dt / tc)); }
  if (d.V > 0.3 && c.T > 330) c.T = 330;
  // sôi và bay hơi nước
  c.boil = false;
  const nW = c.sp.H2O || 0;
  if (nW > 0 && c.T > 100){
    const nEv = Math.min(nW, Cp * (c.T - 100) / 40650);
    if (nW - nEv < 1e-9) delete c.sp.H2O; else c.sp.H2O = nW - nEv;
    c.T -= nEv * 40650 / Cp; c.steam += nEv; c.boil = nEv > 1e-7 && nW * 18 > 0.3;
  }
  c.T = clamp(c.T, -30, 1100);
  // lịch sử để vẽ đồ thị
  c.hAcc += dt;
  if (c.hAcc >= c.hInt){
    c.hAcc = 0;
    const dd = derive(c);
    c.hist.push({t:now, T:c.T, pH:calcPH(c, dd), g:totalGas(c)});
    if (c.hist.length > 360){ c.hist = c.hist.filter((_, i) => i % 2 === 0); c.hInt *= 2; }
  }
}

/* ============================================================
   pH — giải phương trình bảo toàn điện tích
   ============================================================ */
function sysCharge(sys, C, H){
  const K = sys.Ka; let term = 1, D = 1, num = 0;
  for (let i = 0; i < K.length; i++){ term *= K[i] / H; D += term; num += (i + 1) * term; }
  return C * (sys.z - num / D);
}
function calcPH(c, d){
  if (!d.wet || d.VL < 1e-7) return null;
  let q = 0; const tot = {};
  for (const id in c.sp){
    const s = SP[id]; if (!s.ab) continue;
    const C = dissolved(c, d, id) / d.VL; if (C <= 0) continue;
    q += (s.ab.q || 0) * C;
    if (s.ab.sys) for (const k in s.ab.sys) tot[k] = (tot[k] || 0) + s.ab.sys[k] * C;
  }
  const f = pH => { const H = Math.pow(10, -pH); let v = H - 1e-14 / H + q; for (const k in tot) v += sysCharge(SYS[k], tot[k], H); return v; };
  let lo = -1.5, hi = 15.5;
  if (f(lo) <= 0) return lo;
  if (f(hi) >= 0) return hi;

function drawChart(v){
  const cv = $('#chart'); if (!cv) return;

  const pw = Math.round(W * dpr), ph = Math.round(H * dpr);

  const g = cv.getContext('2d'); if (!g) return;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);

  const val = p => key === 'T' ? p.T : key === 'pH' ? p.pH : p.g * VM_DKC * 1000;

  let lo = Infinity, hi = -Infinity; for (const p of pts){ const y = val(p); if (y < lo) lo = y; if (y > hi) hi = y; }
  if (key === 'pH'){ lo = 0; hi = 14; } else if (key === 'T'){ lo = Math.min(20, Math.floor(lo / 5) * 5); hi = Math.max(40, Math.ceil(hi / 5) * 5); } else { lo = 0; hi = Math.max(10, hi * 1.1); }
  const L = 40, R = 14, T = 10, B = 22, t0 = pts[0].t, t1 = pts[pts.length - 1].t, X = t => L + (t - t0) / Math.max(1e-6, t1 - t0) * (W - L - R), Y = y => H - B - (y - lo) / (hi - lo) * (H - T - B);
  g.strokeStyle = line; g.lineWidth = 1; g.textAlign = 'right';
  for (let i = 0; i <= 4; i++){ const y = lo + (hi - lo) * i / 4, py = Y(y); g.beginPath(); g.moveTo(L, py); g.lineTo(W - R, py); g.stroke(); g.fillText(fmt(y, 3), L - 6, py); }
  g.textAlign = 'left'; g.fillText(clock(t0), L, H - 9); g.textAlign = 'right'; g.fillText(clock(t1), W - R, H - 9);
  g.beginPath(); pts.forEach((p, i) => { const x = X(p.t), y = Y(val(p)); if (i) g.lineTo(x, y); else g.moveTo(x, y); });
  g.strokeStyle = acc; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
  g.lineTo(X(t1), Y(lo)); g.lineTo(X(t0), Y(lo)); g.closePath(); g.globalAlpha = 0.12; g.fillStyle = acc; g.fill(); g.globalAlpha = 1;
  const last = pts[pts.length - 1], ex = X(last.t), ey = Y(val(last));

}

  {t:'Nồng độ mol: C = n / V', f:[['n','n chất tan (mol)'],['V','V dung dịch (mL)'],['C','C (mol/L)']], s:{n:v => v.C * v.V / 1000, V:v => v.n / v.C * 1000, C:v => v.n / (v.V / 1000)}},
  {t:'Nồng độ phần trăm: C% = m chất tan / m dung dịch × 100', f:[['a','m chất tan (g)'],['b','m dung dịch (g)'],['p','C%']], s:{a:v => v.p * v.b / 100, b:v => v.a / v.p * 100, p:v => v.a / v.b * 100}},
  {t:'Pha loãng: C₁ · V₁ = C₂ · V₂', f:[['c1','C₁ (mol/L)'],['v1','V₁ (mL)'],['c2','C₂ (mol/L)'],['v2','V₂ (mL)']], s:{c1:v => v.c2 * v.v2 / v.v1, v1:v => v.c2 * v.v2 / v.c1, c2:v => v.c1 * v.v1 / v.v2, v2:v => v.c1 * v.v1 / v.c2}},

];

    <p class="hint">Với bốn ô công thức ở trên: nhập các ô đã biết, ô còn trống sẽ tự tính và được tô màu.</p>

function kUpdate(src){
  const out = $('#kOut'); if (!out) return;
  let M, comp;
  try { const f = $('#kF').value.trim(); comp = parseFormula(f); M = 0; for (const e in comp) M += AW[e] * comp[e]; }
  catch (err){ out.className = 'hint err'; out.textContent = err.message + '. Hãy viết hoa đúng ký hiệu nguyên tố, ví dụ Ca(OH)2.'; return; }
  if (src === 'kF') src = 'kN';
  const x = num($('#' + src).value); let n = NaN;
  if (src === 'kM') n = x / M; else if (src === 'kN') n = x; else if (src === 'kV') n = x / VM_DKC; else if (src === 'kP') n = x / 6.022;
  const set = (id, v) => { if (id !== src) $('#' + id).value = isFinite(v) ? fmt(v, 4) : ''; };
  set('kM', n * M); set('kN', n); set('kV', n * VM_DKC); set('kP', n * 6.022);
  out.className = 'hint';
  out.innerHTML = 'M = <b>' + fmt(M, 5) + ' g/mol</b>. Thành phần khối lượng: ' + Object.keys(comp).map(e => e + ' ' + fix(AW[e] * comp[e] / M * 100, 2) + ' %').join(' · ') + '.';
}
function solveUpdate(i, el){
  const c = SOLVE[i]; el.classList.remove('auto');
  const vals = {}, blank = [];
  for (const [k] of c.f){ const inp = $('#s' + i + '_' + k); if (inp !== el && inp.classList.contains('auto')){ blank.push(k); continue; } const x = num(inp.value); if (isFinite(x)) vals[k] = x; else blank.push(k); }
  if (blank.length !== 1) return;
  const k = blank[0], r = c.s[k](vals), inp = $('#s' + i + '_' + k);
  inp.value = isFinite(r) ? fmt(r, 4) : ''; inp.classList.add('auto');
}
function phUpdate(src){
  const x = num($('#' + src).value.replace('·10', 'e').replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/g, ch => ({'⁻':'-','⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9})[ch]));
  let pH = NaN;
  if (src === 'hH') pH = -Math.log10(x); else if (src === 'hP') pH = x; else if (src === 'hO') pH = 14 + Math.log10(x); else pH = 14 - x;
  const set = (id, v) => { if (id !== src) $('#' + id).value = isFinite(v) ? fmt(v, 3) : ''; };
  set('hH', Math.pow(10, -pH)); set('hP', pH); set('hO', Math.pow(10, pH - 14)); set('hQ', 14 - pH);

function elPos(z){ // [chu kì hiển thị, cột, chu kì thật, nhóm]

  if (z <= 103) return [10, z - 86, 7, 0]; return [7, z - 100, 7, z - 100];

function elKind(z, sym, col){
  if (z >= 57 && z <= 71) return ['Họ lanthanide', '#f8bbd0']; if (z >= 89 && z <= 103) return ['Họ actinide', '#f48fb1'];

function snap(v, what){
  (v.undo = v.undo || []).push({what, log:v.log.slice(), s:JSON.stringify({sp:v.sp, T:v.T, ind:v.ind, gasOut:v.gasOut, und:v.und, qS:v.qS, steam:v.steam, feed:v.feed, heat:v.heat, burning:v.burning, last:v.last, hist:v.hist, hInt:v.hInt})});
  if (v.undo.length > 12) v.undo.shift();
}
function undoAdd(v){
  const u = v.undo && v.undo.pop();
  if (!u){ toast('Không còn lần thêm chất nào để hoàn tác trong ' + esc(v.name) + '.'); return; }
  Object.assign(v, JSON.parse(u.s)); v.log = u.log; v.act = {}; v.flow = {}; v._burn = null; if (v.fx) v.fx.b.length = 0;
  refresh(v); renderPanel(); if (lab.tab === 'act') renderTools();
  toast('Đã bỏ ' + u.what + '. ' + esc(v.name) + ' trở về đúng lúc trước khi thêm.');
}

  if (name === 'gastest'){ toast(gasTest(v), null, 6500); return; }
  if (name === 'litmus'){ toast(litmusTest(v, v.d, v.pH), null, 6500); return; }
  if (name === 'pour'){ openPour(); return; }
  if (name === 'filter'){
    if (lab.vs.length >= 8){ toast('Bàn hết chỗ đặt chén hứng chất rắn. Hãy cất bớt một dụng cụ.', 'warn'); return; }
    if (!v.solids.length){ toast('Trong ' + esc(v.name) + ' không có chất rắn để lọc.'); return; }
    const keep = lab.sel, n = addVessel('dish'); filterVessel(v, n); refresh(v); refresh(n); lab.sel = keep; renderBench(); renderPanel();
    toast('Đã lọc: chất rắn nằm ở ' + esc(n.name) + ', nước lọc còn lại trong ' + esc(v.name) + '.'); return;
  }
  if (name === 'empty'){ emptyVessel(v); v.undo = []; v.fx.b.length = 0; toast('Đã đổ bỏ và rửa sạch ' + esc(v.name) + '.'); afterChange(); renderPanel(); return; }
  if (name === 'del'){ lab.vs = lab.vs.filter(x => x !== v); lab.sel = lab.vs.length ? lab.vs[0].id : 0; renderBench(); renderPanel(); renderTools(); return; }
}
document.addEventListener('click', e => {
  if (e.target.id === 'sheet'){ closeSheet(); return; }
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const ds = t.dataset;
  if (t.id === 'bPlay'){ lab.paused = !lab.paused; setSpeed(); return; }
  if (t.id === 'bSw'){ lab.sw.on = !lab.sw.on; setSpeed(); return; }
  if (t.id === 'bSwR'){ lab.sw.t = 0; lab.sw.on = false; setSpeed(); renderLive(); return; }
  if (ds.speed){ lab.speed = +ds.speed; lab.paused = false; setSpeed(); return; }
  if (ds.id && t.classList.contains('vessel')){ select(+ds.id); return; }
  if (ds.vid){ select(+ds.vid); return; }
  if (ds.gsec){ const d = $('#g' + ds.gsec); d.open = true; d.scrollIntoView({block:'start', behavior:RM ? 'auto' : 'smooth'}); return; }
  if (ds.tab){ lab.tab = (lab.tab === ds.tab && !isWide()) ? null : ds.tab; renderTools(); return; }
  if (ds.ptab){ lab.ptab = ds.ptab; renderPanel(); return; }
  if (ds.series){ lab.series = ds.series; renderPanel(); return; }
  if (ds.cat){ lab.cat = ds.cat; lab.q = ''; const q = $('#q'); if (q) q.value = ''; updateChem(); return; }
  if (ds.sub){ lab.sub = ds.sub; updateChem(); return; }
  if (ds.el){ showEl(+ds.el); return; }
  if (ds.item){ openAdd(ds.item); return; }
  if (ds.form){ addS.form = ds.form; drawAdd(); return; }
  if (ds.amt){ $('#aAmt').value = ds.amt.replace('.', ','); addCalc(); return; }
  if (ds.conc){ $('#aConc').value = ds.conc.replace('.', ','); addCalc(); return; }
  if (ds.fr){ $('#pFr').value = ds.fr; return; }
  if (ds.act){ const i = ds.act.indexOf(':'); act(i < 0 ? ds.act : ds.act.slice(0, i), i < 0 ? '' : ds.act.slice(i + 1)); }
});
document.addEventListener('input', e => {
  const el = e.target, id = el.id || '';
  if (id === 'q'){ lab.q = el.value; updateChem(); return; }
  if (id === 'aAmt' || id === 'aConc'){ addCalc(); return; }
  if (/^k[FMNVP]$/.test(id)){ kUpdate(id); return; }
  if (/^h[HPOQ]$/.test(id)){ phUpdate(id); return; }
  const m = id.match(/^s(\d+)_/); if (m) solveUpdate(+m[1], el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('resize', () => { if (isWide() && !lab.tab){ lab.tab = 'chem'; renderTools(); } });

/* ---------- vòng lặp thời gian ---------- */
let lastTs = 0, uiAcc = 1;
function flushEvents(){
  while (EVQ.length){
    const e = EVQ.shift(), a = e.c.act[e.r.key];
    if (a) a.seen = performance.now();
    if (e.r.warn) toast('<b>' + esc(e.c.name) + ' · lưu ý an toàn.</b> ' + e.r.warn, 'warn');
    else if (e.r.note) toast('<b>' + esc(e.c.name) + '.</b> ' + e.r.obs, null, 6500);
    else if (e.c.id !== lab.sel) toast('<b>' + esc(e.c.name) + '.</b> ' + (e.r.obs || ''), null, 4500);
  }
}
function frame(ts){
  const dtR = lastTs ? Math.min(0.1, Math.max(0, (ts - lastTs) / 1000)) : 0; lastTs = ts;
  if (!lab.paused && dtR > 0){
    const dtS = dtR * lab.speed, n = Math.max(1, Math.ceil(dtS / 0.25)), h = dtS / n;
    for (let i = 0; i < n; i++){ lab.t += h; if (lab.sw.on) lab.sw.t += h; for (const v of lab.vs) stepVessel(v, h, lab.t); }
  }
  const is3 = lab.view === '3d' && V3.ok;
  for (const v of lab.vs){ refresh(v); if (!is3) drawVessel(v, dtR); }
  if (is3) V3.frame(lab.vs, dtR);
  uiAcc += dtR; if (uiAcc >= 0.2){ uiAcc = 0; renderLive(); }
  flushEvents();
  requestAnimationFrame(frame);
}

/* ---------- khởi động ---------- */
function demo(){
  const a = addVessel('beaker250'); addReagent(a, 'HCl', 'soln', 60, 1); addReagent(a, 'Zn', 'solid', 3); a.last = null;
  const b = addVessel('tube'); addReagent(b, 'CuSO4', 'soln', 12, 0.5); b.last = null;
  lab.vs.forEach(refresh); lab.sel = a.id; renderBench(); renderPanel();
}
function snapshot(){
  return {t:lab.t, speed:lab.speed, cnt:lab.cnt, sel:lab.sel, ptab:lab.ptab,
    vs:lab.vs.map(v => ({type:v.type, name:v.name, sp:v.sp, T:v.T, heat:v.heat, ind:v.ind, gasOut:v.gasOut, und:v.und, qS:v.qS, steam:v.steam, pick:v.id === lab.sel}))};
}
function start(data){
  if (V3.init && V3.init($('#b3d'))){
    let pref = '3d'; try { pref = localStorage.getItem('lab-view') || '3d'; } catch (e){ /* dùng mặc định */ }
    lab.view = pref === '2d' ? '2d' : '3d';
    V3.onLost = () => { lab.view = '2d'; renderBench(); toast('Máy không giữ được chế độ 3D nên trang đã chuyển sang hình vẽ 2D.', 'warn'); };
  }
  if (data && Array.isArray(data.vs) && data.vs.length){
    lab.t = data.t || 0; lab.speed = SPEEDS.includes(data.speed) ? data.speed : 1; lab.cnt = data.cnt || {}; lab.ptab = data.ptab || 'comp';
    for (const o of data.vs){
      if (!VTYPES[o.type]) continue;
      const v = newVessel(o.type, o.name); v.fx = {b:[]};
      for (const id in o.sp) if (SP[id]) v.sp[id] = o.sp[id];
      v.T = o.T; v.heat = o.heat || 0; v.ind = o.ind || null; v.gasOut = o.gasOut || {}; v.und = o.und || {}; v.qS = o.qS || 0; v.steam = o.steam || 0;
      refresh(v); lab.vs.push(v); if (o.pick) lab.sel = v.id;
    }
    if (!selV() && lab.vs.length) lab.sel = lab.vs[0].id;
    renderBench(); renderPanel();
  } else demo();
  setSpeed(); renderTools();
  if (!(data && data.vs)) toast('Cốc 1 đang có kẽm phản ứng với HCl. Mở <b>Hoá chất</b> để tự thêm chất, bấm ×2, ×10 để tua nhanh. Nút <b>Hướng dẫn</b> ở trên cùng giải thích từng phần.', null, 9000);
  requestAnimationFrame(frame);
}
const HOT = window.claude && window.claude.hot;
if (HOT && HOT.snapshot) HOT.snapshot(snapshot);
if (HOT && HOT.ready) HOT.ready(start); else start((HOT && HOT.data) || {});

</script>
